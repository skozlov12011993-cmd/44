  - id: task-9367
    title: Визуальная заглушка главного лендинга
    description: >-
      Создать первый видимый результат — базовый одностраничный лендинг компании
      «4G Инженеры» со всеми блоками на статических данных-заглушках: шапка с
      логотипом, телефоном и кнопкой «Заказать звонок», первый экран с
      заголовком, подзаголовком и формой обратной связи, блок этапов работы,
      комплекты с ценами, преимущества, статьи, отзывы и контакты.

      Цель: дать пользователю целостный визуальный результат как можно быстрее.
      Реализовать только то, что пользователь увидит при открытии приложения.
      Тёмно-синяя гамма с оранжевым/ярко-жёлтым акцентом.
    status: completed
    acceptance_criteria:
      - Все блоки лендинга отображаются в заданном порядке
      - Используется тёмно-синяя гамма с оранжевым акцентом
      - Страница корректно выглядит на телефоне (320px+), планшете и десктопе
    summary: "Реализована визуальная заглушка одностраничного лендинга «4G Инженеры»
      в тёмно-синей гамме с оранжевым акцентом. Все блоки собраны по порядку:
