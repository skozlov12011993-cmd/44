  - id: task-8341
    title: >-
      В блок «Полезные статьи» добавить новую кликабельную карточку с заголовком
      «4G-интернет vs Спутниковый интернет для частного дома: что выбрать?»,
      которая открывается всплывающим окном (Dialog). Вставить в это всплывающее
      окно полный текст статьи, присланный пользователем, при этом две таблицы
      («Сравнительная таблица» и «Ваш случай — Что выбирать») оформить как
      таблицы.


      Полный текст статьи для вставки:


      "Когда речь заходит об интернете для загородного дома, у многих первая
      мысль — спутник. Особенно если слышали про зарубежные низкоорбитальные
      системы или видели рекламу отечественных операторов. Кажется, что тарелка
      на крыше решит все проблемы раз и навсегда.


      Но так ли это на самом деле? Давайте разберёмся честно и без рекламных
      уловок. Сравним две технологии по ключевым параметрам и выясним, какой
      вариант подходит именно вам.


      Краткий итог для тех, кто торопится

      Если у вас есть хотя бы слабый сигнал 4G (1–2 деления на телефоне) —
      выгоднее и проще усиливать его с помощью направленной антенны и
      качественного модема. Это даст более высокую скорость, низкую задержку и в
      разы меньшие ежемесячные платежи.

      Если 4G нет вообще — ни одна SIM-карта не ловит на участке, вы в лесу или
      в низине за много километров от вышек — спутник становится единственным
      вариантом. Но готовьтесь к высокой стоимости и особенностям в работе.


      Что такое спутниковый интернет и почему он дорогой

      Спутниковый интернет в России представлен несколькими игроками.
      Классический вариант — геостационарные спутники (VSAT-станции) от
      отечественных операторов спутникового телевидения и связи. В последние
      годы появились и низкоорбитальные системы, которые обещают более высокую
      скорость и низкую задержку.


      Стоимость — главный барьер:

      Оборудование для геостационарного спутника: от 40 000 рублей за
      VSAT-станцию.

      Ежемесячные тарифы: от 900 рублей за 5 ГБ трафика. Безлимит — минимум 3
      500 рублей в месяц.

      Низкоорбитальные системы: оборудование — около 35 000–40 000 рублей,
      абонентская плата — примерно 7 000–8 000 рублей в месяц (в пересчёте с
      зарубежной валюты).

      Для сравнения: наш 4G-комплект стоит 18 000–35 000 рублей (однократно), а
      тариф на безлимитный 4G-интернет — от 400 до 1 500 рублей в месяц.
      Экономия за год — десятки тысяч рублей.


      Задержка (пинг): почему видеозвонки и игры могут не работать

      Это самый важный параметр, который многие недооценивают.

      У 4G-интернета пинг — 30–50 мс. Видеозвонки в Zoom, онлайн-игры, удалённое
      управление компьютером — всё работает комфортно.

      У геостационарного спутникового интернета задержка составляет 700–800 мс.
      Это в 15–20 раз больше. Видеозвонок будет с постоянными «зависаниями»,
      игры станут невозможны.

      У низкоорбитальных систем ситуация лучше — пинг около 35–50 мс, сопоставим
      с 4G. Но такие системы требуют идеально чистого обзора неба — любое дерево
      или свес крыши могут полностью убить соединение.


      Зависимость от погоды и препятствий

      4G с качественной антенной — практически не зависит от погоды. Дождь,
      снег, туман — на уровне сигнала это сказывается минимально. Препятствия
      (стены, деревья) решаются выносом антенны на крышу.

      Спутник — капризен. Сильный дождь или снегопад заметно ухудшают качество
      сигнала. А если у вас есть деревья рядом с домом — они могут перекрывать
      спутник, и интернет будет постоянно «плавать» или пропадать.


      Реальная скорость: что вы получите на практике

      У 4G с качественным комплектом (Cat.6 и выше, MIMO-антенна) — 80–250
      Мбит/с стабильно.

      У классического геостационарного спутника — до 40 Мбит/с входящего трафика
      и 10 Мбит/с исходящего на безлимитных тарифах. На бюджетных пакетах — ещё
      ниже.

      У низкоорбитальных систем — до 100–200 Мбит/с, но это зависит от загрузки
      спутников и региона. Однако есть нюанс: как показывает практика, скорость
      теста и реальная работа сайтов могут сильно различаться. Некоторые
      пользователи жалуются, что Speedtest показывает отличные цифры, но при
      этом сайты подвисают из-за проблем с задержкой и потерями пакетов.


      А что насчёт 4G? У него тоже есть свои ограничения

      Мы за честное сравнение. 4G-интернет — отличное решение для большинства
      загородных домов, но было бы нечестно утверждать, что у него нет слабых
      мест. Давайте разберём их, чтобы вы принимали решение с открытыми глазами.


      1. Зависимость от загрузки вышки

      Это самая частая проблема, о которой мы предупреждаем клиентов. Вышка —
      общий ресурс для всех абонентов в радиусе нескольких километров. И если в
      вашем СНТ много соседей, которые вечером включают YouTube и
      онлайн-кинотеатры — скорость может упасть в 2–3 раза.


      Как это выглядит на практике:

      Утром — 100 Мбит/с.

      Вечером (в час пик, с 19 до 23) — 20–30 Мбит/с.

      В выходные и праздничные дни — ситуация может повторяться.


      Что мы делаем: подбираем оператора с наименее загруженной вышкой,
      настраиваем Band Lock на частоты, которые меньше загружены, а при
      возможности — перенаправляем антенну на другую вышку. Полностью убрать
      эффект «вечерней загрузки» невозможно, но снизить его влияние — можно.


      2. Не все операторы разрешают «безлимит» в роутерах

      Это важный юридический момент. Многие тарифы, которые оператор рекламирует
      как «безлимитные», на самом деле предназначены для смартфонов. При
      использовании в роутере или модеме оператор может:

      Снизить скорость после определённого объёма трафика (например, после 50
      ГБ).

      Ограничить доступ к торрентам, файлообменникам или игровым серверам.

      В некоторых случаях — полностью заблокировать SIM-карту для использования
      в модемах.


      Как мы помогаем: мы консультируем по тарифам, которые официально разрешены
      для использования в модемах и роутерах, и предупреждаем о рисках
      «телефонных» тарифов. Мы не продаём SIM-карты, но знаем, у какого
      оператора и в каком регионе меньше ограничений.


      3. Погодные аномалии

      4G-сигнал — это радиоволна, а радиоволны подвержены влиянию атмосферы.
      Сильный ливень, снегопад, туман или гроза могут снизить качество сигнала
      на 10–30%. Обычно это заметно только в экстремальных условиях, но
      полностью исключить влияние погоды нельзя.


      Что мы делаем: используем антенны с высоким коэффициентом усиления и
      низким уровнем шума, которые «пробивают» погодные помехи лучше, чем
      дешёвые аналоги. В наших комплектах потери из-за погоды минимальны и почти
      незаметны для пользователя.


      4. Изменения в сети оператора

      Операторы постоянно модернизируют оборудование: переносят частоты,
      отключают старые диапазоны, вводят новые технологии. В один прекрасный
      день ваша любимая частота Band 20 может стать менее приоритетной или
      вообще исчезнуть.


      Что мы делаем: благодаря кастомной прошивке и Band Lock мы можем
      оперативно перенастроить модем на другие частоты. Если проблема массовая —
      подскажем, как сменить оператора или перенаправить антенну.


      5. 4G просто нет в некоторых местах

      Да, бывает и такое. В глухой тайге, высоко в горах или в низине, куда не
      доходит сигнал ни одного оператора, 4G не работает. В этом случае спутник
      действительно остаётся единственным вариантом.


      Как мы проверяем: перед покупкой мы всегда рекомендуем проверить сигнал
      через SIM-карту в телефоне. Если на участке хотя бы 1–2 деления —
      4G-комплект с антенной решит проблему. Если сигнала нет совсем — мы честно
      скажем, что 4G не вариант.


      Сравнительная таблица

      Таблица 1: Параметр / 4G-интернет (наш комплект) / Геостационарный спутник
      (VSAT) / Низкоорбитальный спутник

      - Стоимость оборудования: 18 000 – 35 000 руб. / от 40 000 руб. / ~35 000
      – 40 000 руб.

      - Абонентская плата: 400 – 1 500 руб./мес. / 900 – 3 500+ руб./мес. / ~7
      000 – 8 000 руб./мес.

      - Скорость: 80 – 250 Мбит/с / 10 – 40 Мбит/с / до 200 Мбит/с

      - Пинг (задержка): 30 – 50 мс / 700 – 800 мс / ~35 – 50 мс

      - Видеозвонки / Игры: Да / Нет (из-за пинга) / Да (при хорошем обзоре)

      - Влияние погоды: Минимальное / Сильное / Умеренное

      - Зависимость от загрузки сети: Есть (вечерние пики) / Нет / Нет

      - Ограничения оператора: Есть (тарифы, блокировки) / Есть (FUP, лимиты
      трафика) / Есть (FUP, лимиты трафика)

      - Требования к установке: Направить на вышку / Чистый обзор неба /
      Полностью открытое небо

      - Когда выбирать: Если есть сигнал 4G / Если 4G нет совсем / Если 4G нет,
      нужна работа и готовы платить


      Главный нюанс: спутник не терпит препятствий

      Это важный момент. У 4G-антенны достаточно «поймать» сигнал с вышки —
      можно работать, даже если есть деревья или соседний дом частично
      перекрывают направление.

      У спутника — требуется прямой обзор на большое открытое пространство неба.
      Если у вас есть деревья, высокий забор или даже свес крыши, который
      перекрывает 5% обзора — этого достаточно, чтобы соединение стало
      нестабильным. Специализированные приложения для низкоорбитальных систем
      показывают карту препятствий, и их нужно устранять. Не у всех есть такая
      возможность.


      Когда спутник — единственное решение

      Спутниковый интернет оправдан только в одном случае: когда 4G-сигнал на
      участке отсутствует полностью. Это бывает:

      В глухой лесной местности.

      В низине, куда не доходит сигнал от вышек.

      В удалённых районах, где нет покрытия ни одного оператора.

      Если вы находитесь в такой ситуации, альтернативы действительно нет —
      только спутник. Но и здесь стоит выбирать с умом: если нужен стабильный
      интернет для работы (видеозвонки, конференции) — рассматривайте
      низкоорбитальные системы, а не классическую VSAT-станцию. Если нужен
      только для почты и мессенджеров — хватит и бюджетных вариантов.


      Когда 4G — лучшее решение

      4G-интернет выигрывает, если:

      Есть хотя бы минимальный сигнал на участке (на телефоне загорается 1–2
      деления).

      Вы работаете удалённо — нужны видеозвонки и стабильное соединение без
      «зависаний».

      Вы смотрите видео в 4K, играете в онлайн-игры — пинг имеет решающее
      значение.

      Вы хотите экономить на ежемесячных платежах.


      Что мы предлагаем: комплект, который подбирается под вашу локацию:
      промышленный модем с агрегацией частот (Cat.6–22), панельная MIMO-антенна
      (или параболическая на дистанциях 10+ км), качественные кабели с низким
      затуханием и кастомная прошивка с настройкой под вашу вышку.


      Результат: стабильные 80–250 Мбит/с — как в городе, но по цене в разы
      дешевле спутника.


      Что в итоге?

      Ни одна технология не идеальна. У 4G есть ограничения по загрузке вышек и
      политике операторов. У спутника — высокая цена, проблемы с пингом (у
      геостационарных систем) и требования к обзору неба.


      Наш подход: мы не продаём «идеальное решение». Мы помогаем выбрать лучшее
      для ваших условий. Если 4G ловит — мы предложим комплект, который выжмет
      максимум из вашей вышки. Если не ловит — честно скажем, что спутник — ваш
      вариант.


      И в любом случае мы будем на связи, чтобы помочь с настройкой и решением
      проблем.


      Таблица 2: Ваш случай / Что выбирать

      - Есть 4G-сигнал (даже слабый): Наш 4G-комплект — быстрее, дешевле,
      стабильнее

      - Нет 4G-сигнала вообще, нужен только для почты: Классический
      геостационарный спутник

      - Нет 4G-сигнала вообще, нужна работа/видеозвонки/игры: Низкоорбитальный
      спутник (если чистый обзор неба)


      Не уверены, какой вариант ваш?

      Мы поможем разобраться:

      Бесплатно проверим сигнал 4G на вашем участке.

      Подскажем, какой оператор работает лучше.

      Предложим 2–3 варианта комплекта с ценами.

      Расскажем про спутник, если 4G нет — без навязывания.


      Звоните или пишите — мы на связи и поможем выбрать лучшее решение для
      вашего дома."
