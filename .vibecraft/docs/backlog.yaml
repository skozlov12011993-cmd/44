  - id: task-6813
    title: >-
      В блок «Полезные статьи» добавить новую кликабельную карточку с заголовком
      «Почему нам можно доверять: гарантии, которые работают», которая
      открывается всплывающим окном (Dialog). Вставить в это всплывающее окно
      полный текст статьи, присланный пользователем, при этом таблицу в разделе
      «Гарантия НЕ распространяется на» оформить как таблицу.


      Полный текст статьи для вставки:


      "Интернет для загородного дома — это не про «купил и забыл». Это про
      стабильность, про работу, про нервы. И когда мы говорим «мы собираем
      комплекты вручную», мы понимаем, что за этим стоит вопрос доверия.


      Как убедиться, что вы не переплачиваете за воздух? Как проверить, что
      сборка действительно качественная, а не просто красивые слова в рекламе?


      Мы подготовили честный ответ на этот вопрос. Без общих фраз, без «мы самые
      лучшие». Только факты, гарантии и то, как мы работаем с каждым клиентом.


      Что такое «доверие» в нашей сфере?

      Для нас доверие — это когда вы понимаете:

      Что именно вы покупаете. Не просто «комплект», а конкретные компоненты с
      характеристиками, которые мы можем объяснить на пальцах.

      Как это будет работать в ваших условиях. Не «в среднем по больнице», а
      именно у вас — с учётом расстояния до вышки, рельефа, материалов дома.

      Что делать, если что-то пошло не так. У нас есть алгоритм: вы звоните — мы
      решаем. Быстро, без очередей и перекладывания ответственности.

      Что вы не переплачиваете. Цена окончательная, никаких «сюрпризов» на этапе
      монтажа или настройки.


      Наши гарантии — не просто слова, а прописанные обязательства

      Мы не говорим «мы даём гарантию». Мы говорим, какую именно гарантию и на
      каких условиях.


      Гарантия 1. На оборудование — 12 месяцев

      Мы даём официальную гарантию на все комплектующие: модем, антенну, кабели,
      блоки питания и роутер.


      Почему мы уверены в качестве:

      Мы используем промышленные модемы, которые рассчитаны на круглосуточную
      работу, а не на пару часов в день.

      Мы сами тестируем каждый комплект перед отправкой, и если что-то идёт не
      так — мы это видим на стенде, а не вы в первый день использования.

      Мы закупаем компоненты напрямую у производителей, а не у перекупщиков, и
      знаем, что внутри каждой коробки.


      Что покрывает гарантия:

      Выход из строя модема по вине производителя.

      Выход из строя роутера по вине производителя.

      Нестабильная работа антенны (если она не держит сигнал при правильной
      настройке).

      Выход из строя программного обеспечения комплекта.


      Что НЕ входит в гарантию (чтобы было честно)

      Мы хотим, чтобы вы чётко понимали границы нашей ответственности. Это
      защищает и вас (вы знаете, за что платите), и нас (мы не берём на себя то,
      что не можем контролировать).


      Гарантия НЕ распространяется на:

      Таблица: Ситуация / Почему это не гарантийный случай

      - Механические повреждения: Если вы уронили антенну, перебили кабель
      лопатой, погнули разъёмы, сломали роутер при установке — это не заводской
      брак, а следствие неправильной эксплуатации.

      - Залитие водой, попадание грязи, насекомых внутрь корпуса: Даже уличные
      антенны должны быть установлены с соблюдением герметизации. Если вода
      попала из-за того, что вы не загерметизировали разъёмы или не затянули
      гайки — это ответственность монтажника (или ваша, если ставили сами).

      - Перепады напряжения и скачки в электросети: Если в вашем доме часто
      «скачет» напряжение, и от этого сгорел блок питания или роутер — это
      проблема электрики в доме, а не качества комплектующих. Мы рекомендуем
      использовать стабилизатор напряжения для защиты оборудования.

      - Несовместимость с вашим роутером или устройством: Если вы подключаете
      наш модем к своему роутеру, а он его «не видит» или не даёт нужной
      скорости — это не брак модема. Это вопрос совместимости, который мы
      помогаем решить до покупки. Если вы купили комплект без консультации — мы
      поможем настроить, но замена модема по этой причине не является
      гарантийной.

      - Проблемы со стороны оператора: Если оператор перегрузил вышку, ввёл
      ограничения на вашем тарифе, изменил частоты или отключил агрегацию — это
      не вина оборудования. Мы поможем перенастроиться (Band Lock, смена
      оператора), но сам факт «скорость упала из-за оператора» — не гарантийный
      случай.

      - Естественный износ: Например, блок питания со временем может выйти из
      строя (обычно через 3–5 лет) — это не брак, а нормальный ресурс.

      - Самостоятельное вмешательство в прошивку: Если вы сами перепрошили
      модем, сбросили настройки или залили неподходящую прошивку — гарантия
      аннулируется. Мы загружаем кастомную прошивку с настройками под вашу
      вышку, и менять её без нас не рекомендуется.

      - Косметические дефекты: Если на корпусе антенны появились царапины или
      потёртости, но она работает штатно — это не повод для замены.

      - Нестабильная работа при использовании нештатных БП или удлинителей: Мы
      не гарантируем стабильность, если вы подключаете модем через неподходящий
      блок питания, неоригинальные переходники или используете некачественные
      USB-удлинители.


      Что мы делаем, если проблема не гарантийная, но вы обратились к нам?

      Мы не бросаем клиентов. Даже если случай не покрывается гарантией, мы:

      Помогаем диагностировать проблему бесплатно — по телефону или удалённо.

      Даём рекомендации по устранению (например, заменить блок питания,
      перенастроить роутер, добавить стабилизатор).

      Предлагаем ремонт за разумную плату, если это экономически целесообразно
      (например, замена разъёма на кабеле, перепайка соединений).

      Если проблема связана с оператором — помогаем подобрать другого оператора
      или настраиваем Band Lock на частоты, которые работают стабильнее.

      Мы на вашей стороне, даже если формально это не гарантийный случай. Просто
      иногда это решается бесплатно, иногда — за небольшие деньги, но мы всегда
      находим вариант.


      Гарантия 2. Поддержка по настройкам

      Это то, чего нет ни в одном магазине на маркетплейсе. Мы не бросаем
      клиента после продажи.


      Что значит «поддержка по настройкам»:

      Вы можете позвонить или написать нам в любой момент — не только в течение
      гарантийного срока, а всегда.

      Мы помогаем с перенастройкой, если вы сменили оператора или переехали.

      Мы консультируем, если изменились частоты на вышке или оператор обновил
      оборудование.

      Мы объясняем, как решить проблему, даже если она не связана с нашим
      комплектом (например, проблемы с роутером или компьютером).

      Никаких дополнительных платежей. Поддержка — часть нашей работы, а не
      отдельная услуга.


      Гарантия 3. Честная консультация до покупки

      Мы не продаём «самый дорогой комплект» всем подряд. Мы подбираем
      оборудование под вашу задачу. И иногда это означает, что мы отговариваем
      клиента от излишне мощного решения.


      Как мы консультируем:

      Мы задаём 5 ключевых вопросов: где дом, сколько метров до вышки, из чего
      стены, сколько пользователей, какие задачи (работа, видео, игры).

      По этим ответам мы подбираем 2–3 варианта с разной ценой и объясняем, чем
      они отличаются.

      Мы всегда объясняем, что будет, если взять «подешевле», и что даст
      «подороже».

      Мы не скрываем, что в некоторых случаях обычный роутер с SIM-картой даст
      тот же результат, что и наш комплект. Мы говорим это прямо.

      Почему это важно: мы хотим, чтобы вы были уверены в своём выборе. Если вы
      купите комплект, который вам не нужен, мы потеряем ваше доверие. Это
      дороже любой выгоды с одной продажи.


      Гарантия 4. Прозрачная цена без скрытых платежей

      Многие компании любят манить низкой ценой за «базовый комплект», а потом
      добавлять:

      «Установка» — отдельно.

      «Настройка прошивки» — отдельно.

      «Крепления для антенны» — отдельно.

      «Удлинитель кабеля» — отдельно.

      Мы работаем иначе.


      В нашей цене уже есть:

      Все комплектующие, которые мы подобрали под ваш случай.

      Кастомная прошивка и настройка.

      Обжатые кабели и пайка.

      Корпус для защиты модема от внешней среды.

      Инструкция и удалённая помощь при первом запуске.

      Никаких доплат на месте — вы платите один раз и получаете готовый
      комплект. Если нужен монтаж — мы оговариваем цену заранее, и она
      фиксированная.


      Гарантия 5. Монтаж — только по вашему желанию

      Мы не навязываем установку. Если вы уверены, что справитесь сами — мы даём
      подробную инструкцию с картинками и схемой подключения. Если хотите, чтобы
      всё было сделано профессионально — выезжает инженер.


      Что входит в монтаж:

      Подъём антенны на крышу или мачту.

      Прокладка и крепление кабеля.

      Герметизация разъёмов и мест ввода в дом.

      Первичная настройка и проверка скорости.

      Цена монтажа фиксированная и озвучивается до начала работ.


      Почему мы берём на себя такие обязательства?

      Мы не китайская фабрика, собирающая десятки тысяч одинаковых коробок в
      день. Мы — небольшая команда инженеров, для которых репутация важнее
      «продать любой ценой».

      Мы отвечаем за каждую сборку лично. Если модем не работает — мы это видим
      на тестовом стенде до того, как комплект уехал к вам.

      Мы не уходим в тень после продажи. У нас есть телефон, почта, мессенджеры
      — мы на связи 24/7.

      Мы знаем, что плохой отзыв или жалоба в соцсетях убивает доверие быстрее,
      чем любой маркетинг. Поэтому мы работаем на совесть.

      Мы не идеальны, и ошибки случаются. Но мы всегда признаём их, исправляем и
      делаем так, чтобы клиент остался с работающим интернетом.


      Хотите убедиться лично?

      Мы не просим верить нам на слово. Мы просим позвонить, задать вопросы,
      проверить.

      Если у вас есть сомнения — мы их развеем.

      Если вы не уверены, какой комплект нужен — мы подберём.

      Если вам кажется, что мы слишком дорогие — мы объясним, за что платите.

      Мы не продаём коробку. Мы продаём стабильный интернет в вашем доме. А это
      — то, что можно проверить только на практике.


      Свяжитесь с нами:

      Задайте вопрос по оборудованию.

      Закажите выезд инженера для замера сигнала.

      Получите 2–3 варианта с ценами на комплект под вашу локацию.

      Мы на связи. И мы готовы ответить за каждое слово."
