      Первичная настройка и проверка скорости.

      Цена монтажа фиксированная и озвучивается до начала работ.


      Почему мы берём на себя такие обязательства?

      Мы не китайская фабрика, собирающая десятки тысяч одинаковых коробок в
      день. Мы — небольшая команда инженеров, для которых репутация важнее
      «продать любой ценой».

      Мы отвечаем за каждую сборку лично. Если модем не работает — мы это видим
      на тестовом стенде до того, как комплект уехал к вам.

      Мы не уходим в тень после продажи. У нас есть телефон, почта, мессенджеры
      — мы на связи 24/7.

      Мы знаем, что плохой отзыв или жалоба в соцсетях убивает доверие быстрее,
      чем любой маркетинг. Поэтому мы работаем на совесть.

      Мы не идеальны, и ошибки случаются. Но мы всегда признаём их, исправляем и
      делаем так, чтобы клиент остался с работающим интернетом.


      Хотите убедиться лично?

      Мы не просим верить нам на слово. Мы просим позвонить, задать вопросы,
      проверить.

      Если у вас есть сомнения — мы их развеем.

      Если вы не уверены, какой комплект нужен — мы подберём.

      Если вам кажется, что мы слишком дорогие — мы объясним, за что платите.

      Мы не продаём коробку. Мы продаём стабильный интернет в вашем доме. А это
      — то, что можно проверить только на практике.


      Свяжитесь с нами:

      Задайте вопрос по оборудованию.

      Закажите выезд инженера для замера сигнала.

      Получите 2–3 варианта с ценами на комплект под вашу локацию.

      Мы на связи. И мы готовы ответить за каждое слово."
