  - id: task-5951
    title: >-
      В блок «Полезные статьи» добавить подблок-карточку «Как усилить сигнал
      интернета в частном доме: опыт настройки 4G в условиях глухой дачи и
      кирпичных стен», кликабельную с открытием всплывающего окна (Dialog).
      Вставить в это всплывающее окно полный текст статьи, присланный
      пользователем.


      Текст статьи для вставки:


      "Как усилить сигнал интернета в частном доме: опыт настройки 4G в условиях
      глухой дачи и кирпичных стен


      Каждый второй звонок в нашу техподдержку начинается одинаково: «Интернет
      есть, но ничего не грузится, видео стоит, а на созвонах по работе меня
      постоянно „выбрасывает“. Владельцы загородных домов и дач сталкиваются с
      этим сплошь и рядом. И дело здесь не в «плохом операторе» или «сломанном
      роутере». 4G-сигнал — это радиоволна, а радиоволны не любят стены,
      расстояния и погоду. О том, как подружиться с этой волной и выжать из
      вышки всё возможное, мы и расскажем в материале.


      Начните с малого: география роутера внутри дома

      Даже самый дорогой роутер окажется бесполезным, если он стоит в углу за
      холодильником. Прежде чем заказывать у нас антенну или усилитель,
      выполните один простой эксперимент — это займёт полчаса и иногда сразу
      решает проблему.


      Что можно попробовать сделать самостоятельно:

      Поставьте роутер на подоконник — именно на той стороне дома, которая
      смотрит в сторону города (где обычно находятся вышки). Стекло для
      радиосигнала — почти прозрачное препятствие, а вот стены из кирпича или
      газобетона — уже серьёзный враг.

      Поднимите роутер повыше. Не на полку в шкафу, а хотя бы на антресоль или
      настенную полку. На высоте 1,5–2 метра сигнал заметно стабильнее.

      Уберите подальше микроволновку и внешние диски. Звучит странно, но
      микроволновая печь и интернет-сигнал живут почти на одних частотах (2,4
      ГГц). При работающей СВЧ-печи Wi-Fi может проседать.

      Важно: эти шаги бесплатны и хороши как первая помощь. Но они не работают,
      если расстояние до вышки превышает 3–4 километра или ваш дом построен из
      армированного бетона. Здесь нужна артиллерия.


      Внешняя антенна: ловим честный сигнал без стен

      Если на крыше или на улице смартфон показывает «полные палочки», а внутри
      дома — одну-две, значит, стены съедают основную часть полезного сигнала.
      Внешняя антенна выносится за пределы этого «бункера» и принимает сигнал
      напрямую с вышки, без искажений.


      Какие антенны мы предлагаем и чем они отличаются:

      Направленная (часто «волновая») — принимает сигнал узким лучом, её надо
      поворачивать в сторону вышки. Даёт максимальное усиление. Подойдёт тем,
      кто точно знает, где стоит вышка (визуально или по карте), и готов
      потратить время на точное наведение.

      Всенаправленная (панельная) — собирает сигнал со всех направлений сразу.
      Усиление пониже, зато не нужно мучительно вращать антенну в поисках
      лучшего положения. Идеальна, если вокруг несколько вышек разных операторов
      или рельеф сложный (холмы, лес). Просто закрепил и забыл.

      А теперь главная фишка, про которую молчат 90% статей в интернете. Мало
      просто установить антенну. Важно, чтобы она поддерживала технологию MIMO
      (2х2). Они работают как два потока данных одновременно. Без MIMO вы
      получите просто «громкий» сигнал, но скорость почти не вырастет. С MIMO —
      тот же уровень сигнала, но скорость увеличивается в 1,5–2 раза. У нас в
      каждом комплекте идут антенны именно с MIMO, потому что иначе смысла
      ставить антенну мы не видим.


      Репитер vs Комплект «Антенна + 4G-роутер»: в чём подвох?

      Часто к нам приходят клиенты с вопросом: «А может, купить усилитель
      (репитер), чтобы и телефоны лучше ловили, и интернет шёл?» Отвечаем прямо.


      Репитер (усилитель) — это устройство, которое усиливает всё подряд: и
      полезный сигнал, и шумы, и помехи от соседних вышек. Он подходит, если
      ваша главная задача — чтобы на даче звонил телефон и хоть как-то
      открывались мессенджеры. Для видеозвонков, онлайн-кинотеатров или
      удалённой работы репитер — компромиссное решение, которое часто
      разочаровывает.


      Комплект «антенна + 4G-роутер» — это совсем другая история.

      В модем вставляется SIM-карта, и он сам «договаривается» с вышкой на
      максимально возможной скорости.

      Роутер (особенно уровня Cat.6 или выше) умеет склеивать разные частоты
      (агрегация), получая суммарную скорость. На практике наши клиенты получают
      стабильные 100–200 Мбит/с даже на удалении 5–7 км от вышки. Это скорость
      городского проводного интернета.

      Вы не привязаны к одному оператору — сменили SIM-карту, и всё.


      Коротко о главном: как принять решение за 5 минут?

      Оцените, что вам нужно от интернета:

      Эпизодически проверить почту, почитать новости, позвонить по видеосвязи
      раз в неделю → можно начать с правильно размещённого роутера или репитера
      эконом-класса.

      Вы работаете из дома, дети учатся онлайн, смотрите IPTV и скачиваете файлы
      → только комплект «антенна + 4G модем+роутер». Иного пути нет.

      Посмотрите на расстояние до ближайшей вышки:

      До 3 км и ровная местность → можно обойтись панельной антенной с умеренным
      усилением.

      От 5 км и есть лес/холмы → берите направленную антенну с высоким
      коэффициентом усиления.

      Не экономьте на кабеле и монтаже. В основном мы используем кабель 5D-FB —
      он толще стандартного и теряет меньше сигнала на длине до 10 метров. В
      дешёвых комплектах из интернет-магазинов ставят тонкий кабель, и на 5
      метрах длины вы теряете 30–40% сигнала. Мы этого не допускаем.


      Не уверены в своём выборе? Мы поможем

      В этой статье мы дали схему, но каждая локация уникальна. Дом на склоне,
      лесная чаща, высокая линия электропередач рядом — всё это вносит свои
      коррективы. Именно поэтому мы предлагаем бесплатную консультацию и выезд
      инженера для замеров. Мы не продаём «коробку», мы продаём гарантию
      стабильного интернета именно в вашем доме.


      Оставьте заявку → мы перезвоним, зададим 5 вопросов и предложим 2–3
      варианта с ценами. Вы выбираете — мы монтируем. Всё честно, без скрытых
      платежей и лишней воды."
